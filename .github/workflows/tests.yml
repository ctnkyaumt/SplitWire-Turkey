name: Tests

on:
  push:
    branches-ignore: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: windows-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'

    - name: Run Unit Tests
      run: |
        dotnet test tests/SplitWireTurkey.Tests/SplitWireTurkey.Tests.csproj -c Release --logger "console;verbosity=normal"
